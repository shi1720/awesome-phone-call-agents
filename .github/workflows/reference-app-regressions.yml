name: Reference app regressions

on:
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/reference-app-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/reference-app-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [afterword, casechaser, firstbell, muster, noshowzero, oauth-login-client]
    defaults:
      run:
        working-directory: apps/python/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          case '${{ matrix.app }}' in
            firstbell) python -m pip install -r requirements-dev.txt ;;
            noshowzero) python -m pip install -r requirements.txt ;;
            oauth-login-client) python -m pip install 'httpx>=0.28.1' 'mcp>=1.27.0,<2' ;;
            *) python -m pip install -e . ;;
          esac
      - name: Offline regression tests
        run: python -m pytest -q

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [ai-front-desk, connected, headcount, readycheck, supplyline, vouch]
    defaults:
      run:
        working-directory: apps/typescript/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - if: matrix.app == 'ai-front-desk'
        run: npm --prefix web ci
      - run: npm run typecheck --if-present
      - run: npm run check --if-present
      - run: npm run test --if-present
      - run: npm run build

  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/typescript/callsweep
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install
      - run: bun run build

  muster-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/typescript/muster-phone-to-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run prisma:generate
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run build
      - name: Unit and integration tests with disposable PostgreSQL containers
        run: corepack pnpm test
